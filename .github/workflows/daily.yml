name: Daily briefing

on:
  schedule:
    - cron: "0 4 * * *"   # 06:00 Zurich in summer, 05:00 in winter
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build today's page
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python build.py
      - name: Publish
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add docs
          git commit -m "Briefing $(date -u +%F)" || echo "Nothing new"
          git push
